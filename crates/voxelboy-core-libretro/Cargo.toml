[package]
name = "voxelboy-core-libretro"
description = "Libretro emulator-core adapter for VoxelBoy"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
libloading = "0.8"
voxelboy-core-api = { path = "../voxelboy-core-api" }

# Native core loading necessarily crosses an FFI boundary. Unsafe code is
# confined to this crate and wrapped by the safe EmulatorCore implementation.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"

